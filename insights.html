<body data-page="insights">
  <div id="site-header"></div>
  <main>
    <section class="page-hero insights-hero">
      <div class="container reveal in-view">
        <div class="eyebrow">BREGAN · KNOWLEDGE</div>
        <h1 data-bi-en="Animal nutrition, explained for commercial decisions." data-bi-de="Tierernährung verständlich für kommerzielle Entscheidungen."></h1>
        <p data-bi-en="Short, practical explainers for feed manufacturers, distributors and livestock businesses." data-bi-de="Kurze, praxisnahe Erklärungen für Futtermittelhersteller, Distributoren und Tierhaltungsbetriebe."></p>
      </div>
    </section>

    <section class="insight-topic-strip">
      <div class="container insight-topic-inner">
        <span data-bi-en="Explore topics" data-bi-de="Themen entdecken"></span>
        <a href="#efficiency" data-bi-en="Feed efficiency" data-bi-de="Futtereffizienz"></a>
        <a href="#safety" data-bi-en="Feed safety" data-bi-de="Futtermittelsicherheit"></a>
        <a href="#premix" data-bi-en="Premixes" data-bi-de="Premixe"></a>
        <a href="#minerals" data-bi-en="Minerals & enzymes" data-bi-de="Mineralien & Enzyme"></a>
      </div>
    </section>

    <section class="section insight-grid-section">
      <div class="container">
        <div class="section-heading reveal">
          <div class="eyebrow" data-bi-en="Knowledge hub" data-bi-de="Wissenszentrum"></div>
          <h2 data-bi-en="Useful before the product conversation starts." data-bi-de="Nützlich, bevor das Produktgespräch beginnt."></h2>
          <p data-bi-en="These overviews help frame the production challenge. Product selection, inclusion rate and regulatory suitability should always be confirmed for the specific market and formulation." data-bi-de="Diese Übersichten helfen, die Produktionsherausforderung einzuordnen. Produktauswahl, Einsatzrate und regulatorische Eignung sollten immer für den jeweiligen Markt und die konkrete Formulierung bestätigt werden."></p>
        </div>

        <div class="insight-grid">
          <article class="insight-card reveal" id="efficiency">
            <span class="insight-num">01</span>
            <div class="insight-symbol">↘</div>
            <span class="insight-tag" data-bi-en="Feed efficiency" data-bi-de="Futtereffizienz"></span>
            <h3 data-bi-en="Why FCR is more than a single number" data-bi-de="Warum FCR mehr als nur eine Zahl ist"></h3>
            <p data-bi-en="Feed Conversion Ratio connects feed intake with output. Ingredient quality, gut health, enzymes, management and environment can all influence the result." data-bi-de="Die Futterverwertungsrate verbindet Futteraufnahme und Leistung. Rohstoffqualität, Darmgesundheit, Enzyme, Management und Umwelt können das Ergebnis beeinflussen."></p>
            <a href="products.html?lang=en" class="insight-cta" data-bi-en="Explore efficiency solutions" data-bi-de="Lösungen zur Futtereffizienz entdecken"></a>
          </article>

          <article class="insight-card reveal" id="safety">
            <span class="insight-num">02</span>
            <div class="insight-symbol">◇</div>
            <span class="insight-tag" data-bi-en="Feed safety" data-bi-de="Futtermittelsicherheit"></span>
            <h3 data-bi-en="Mycotoxin management starts before the animal" data-bi-de="Mykotoxinmanagement beginnt vor dem Tier"></h3>
            <p data-bi-en="Risk management combines raw-material awareness, storage, monitoring and appropriate feed strategies. A binder is one part of a broader control system." data-bi-de="Risikomanagement verbindet Rohstoffkenntnis, Lagerung, Überwachung und geeignete Fütterungsstrategien. Ein Binder ist nur ein Teil eines umfassenderen Kontrollsystems."></p>
            <a href="products.html?solution=Mycotoxins" class="insight-cta" data-bi-en="View toxin-management products" data-bi-de="Produkte zum Toxinmanagement ansehen"></a>
          </article>

          <article class="insight-card reveal" id="premix">
            <span class="insight-num">03</span>
            <div class="insight-symbol">▦</div>
            <span class="insight-tag" data-bi-en="Premixes" data-bi-de="Premixe"></span>
            <h3 data-bi-en="What a complete premix simplifies" data-bi-de="Was ein Komplettpremix vereinfacht"></h3>
            <p data-bi-en="A well-designed premix can consolidate multiple micro-ingredients into one controlled inclusion step, supporting consistency and easier traceability." data-bi-de="Ein gut konzipierter Premix kann mehrere Mikrokomponenten in einem kontrollierten Dosierschritt bündeln und so Konstanz und Rückverfolgbarkeit unterstützen."></p>
            <a href="products.html?type=Premixes" class="insight-cta" data-bi-en="Explore premixes" data-bi-de="Premixe entdecken"></a>
          </article>

          <article class="insight-card reveal" id="minerals">
            <span class="insight-num">04</span>
            <div class="insight-symbol">Zn</div>
            <span class="insight-tag" data-bi-en="Minerals" data-bi-de="Mineralien"></span>
            <h3 data-bi-en="Bioavailability changes the value of a mineral source" data-bi-de="Bioverfügbarkeit verändert den Wert einer Mineralquelle"></h3>
            <p data-bi-en="The amount listed in a formula is not the same as the amount effectively available to the animal. Source, antagonists and diet conditions matter." data-bi-de="Die in einer Formel angegebene Menge entspricht nicht automatisch der für das Tier effektiv verfügbaren Menge. Quelle, Antagonisten und Fütterungsbedingungen spielen eine Rolle."></p>
            <a href="products.html?solution=Bioavailability" class="insight-cta" data-bi-en="Explore bioavailability solutions" data-bi-de="Lösungen zur Bioverfügbarkeit entdecken"></a>
          </article>

          <article class="insight-card reveal">
            <span class="insight-num">05</span>
            <div class="insight-symbol">6P</div>
            <span class="insight-tag" data-bi-en="Enzymes" data-bi-de="Enzyme"></span>
            <h3 data-bi-en="Why phytase is used in modern feed" data-bi-de="Warum Phytase in modernem Futter eingesetzt wird"></h3>
            <p data-bi-en="Phytase is used to release phosphorus bound in phytate and can support more efficient mineral use in feed formulations." data-bi-de="Phytase wird eingesetzt, um in Phytat gebundenen Phosphor freizusetzen und eine effizientere Mineralstoffnutzung in Futterformulierungen zu unterstützen."></p>
            <a href="product.html?id=brenzyme-phos" class="insight-cta" data-bi-en="View Brenzyme Phos" data-bi-de="Brenzyme Phos ansehen"></a>
          </article>

          <article class="insight-card reveal">
            <span class="insight-num">06</span>
            <div class="insight-symbol">↺</div>
            <span class="insight-tag" data-bi-en="Gut health" data-bi-de="Darmgesundheit"></span>
            <h3 data-bi-en="Gut health connects nutrition and resilience" data-bi-de="Darmgesundheit verbindet Ernährung und Widerstandsfähigkeit"></h3>
            <p data-bi-en="Digestive balance affects nutrient utilization, litter or excreta quality and the animal's ability to cope with production stressors." data-bi-de="Die Verdauungsbalance beeinflusst Nährstoffnutzung, Einstreu- bzw. Exkrementqualität und die Fähigkeit des Tieres, mit Produktionsstress umzugehen."></p>
            <a href="products.html" class="insight-cta" data-bi-en="Explore gut-health products" data-bi-de="Produkte für Darmgesundheit entdecken"></a>
          </article>
        </div>
      </div>
    </section>

    <section class="insight-faq section">
      <div class="container insight-faq-grid">
        <div class="reveal">
          <div class="eyebrow" data-bi-en="Before you request a quote" data-bi-de="Vor der Angebotsanfrage"></div>
          <h2 class="display-title" data-bi-en="The information that makes a technical conversation faster." data-bi-de="Die Informationen, die ein technisches Gespräch beschleunigen."></h2>
          <p class="lead" data-bi-en="A few details help us direct your request to the right product and technical route." data-bi-de="Einige Angaben helfen uns, Ihre Anfrage zum passenden Produkt und technischen Weg zu führen."></p>
        </div>
        <div class="faq-stack reveal">
          <details open>
            <summary data-bi-en="Which species and production stage?" data-bi-de="Welche Tierart und Produktionsphase?"></summary>
            <p data-bi-en="Broiler starter, grower-finisher, layer stage, dairy, beef or aquaculture needs can lead to very different formulation choices." data-bi-de="Broiler-Starter, Grower-Finisher, Legephase, Milchvieh, Mast oder Aquakultur können zu sehr unterschiedlichen Formulierungsentscheidungen führen."></p>
          </details>
          <details>
            <summary data-bi-en="What is the production challenge?" data-bi-de="Was ist die Produktionsherausforderung?"></summary>
            <p data-bi-en="Examples include feed efficiency, toxin pressure, gut-health support, egg quality, mineral bioavailability or feed hygiene." data-bi-de="Beispiele sind Futtereffizienz, Toxindruck, Darmgesundheit, Eiqualität, Mineralstoff-Bioverfügbarkeit oder Futterhygiene."></p>
          </details>
          <details>
            <summary data-bi-en="What does the current feed formula look like?" data-bi-de="Wie sieht die aktuelle Futterformel aus?"></summary>
            <p data-bi-en="Knowing the current inclusion system, major raw materials and existing additives helps avoid duplication and improves technical relevance." data-bi-de="Kenntnisse über das aktuelle Dosiersystem, Hauptrohstoffe und bestehende Zusatzstoffe helfen, Doppelungen zu vermeiden und die technische Relevanz zu erhöhen."></p>
          </details>
          <details>
            <summary data-bi-en="Which country will the product be used in?" data-bi-de="In welchem Land wird das Produkt eingesetzt?"></summary>
            <p data-bi-en="Market-specific documentation, registration and labeling requirements can affect the final commercial route." data-bi-de="Marktspezifische Dokumentations-, Registrierungs- und Kennzeichnungsanforderungen können den finalen kommerziellen Weg beeinflussen."></p>
          </details>
        </div>
      </div>
    </section>

      <div class="container">
        <div class="cta-box reveal">
          <div>
            <h2 data-bi-en="Turn the question into a product shortlist." data-bi-de="Machen Sie aus der Frage eine Produkt-Shortlist."></h2>

          </div>
          <button class="btn btn-navy" data-open-navigator data-bi-en="Find a solution" data-bi-de="Lösung finden"></button>
