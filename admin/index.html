<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Bregan CMS</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="authView" class="auth-shell">
    <div class="auth-card">
      <img src="../assets/images/bregan-logo.webp?v=4" alt="Bregan" class="auth-logo">
      <p class="eyebrow">BREGAN CONTENT MANAGEMENT</p>
      <h1>Company administration</h1>
      <p class="muted">Manage products, website text, events, documents, inquiries and team access.</p>
      <form id="loginForm" class="stack">
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn primary" type="submit">Sign in</button>
      </form>
      <div class="auth-divider"><span>First setup</span></div>
      <form id="signupForm" class="stack">
        <label>Full name<input name="full_name" autocomplete="name"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label>
        <button class="btn secondary" type="submit">Create account</button>
      </form>
      <p id="authMessage" class="message"></p>
    </div>
  </div>

  <div id="appView" class="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand-block">
        <img src="../assets/images/bregan-logo.webp?v=4" alt="Bregan">
        <div><strong>Bregan CMS</strong><small id="roleBadge">—</small></div>
      </div>
      <nav id="nav">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="products">Products</button>
        <button data-view="content">Website text</button>
        <button data-view="events">Events</button>
        <button data-view="documents">Documents</button>
        <button data-view="inquiries">Inquiries</button>
        <button data-view="media">Media library</button>
        <button data-view="team">Team</button>
        <button data-view="settings">Settings</button>
      </nav>
      <div class="sidebar-footer">
        <a href="../index.html" target="_blank">Open website ↗</a>
        <button id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">BREGAN B.V.</p><h1 id="viewTitle">Dashboard</h1></div>
        <div class="top-actions"><span id="userEmail"></span><button class="btn secondary" id="refreshBtn">Refresh</button></div>
      </header>
      <section id="panel"></section>
    </main>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button class="modal-x" data-close-modal>×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
